<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InZpector!</title>
<style>
  :root { --bg: #e9ebee; --app: #f6f7f9; --card: #fff; --text: #16191d; --muted: #6b7480; --line: #e3e6ea;
          --good: #16a34a; --bad: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #050607; --app: #0f1113; --card: #181b1f; --text: #eceff2; --muted: #8b95a1; --line: #2a2f35; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; justify-content: center; align-items: center; }

  /* Phone-sized app shell: full screen on phones, a phone-shaped card on desktop */
  .wrap { width: 100%; max-width: 430px; min-height: 100dvh; background: var(--app);
          display: flex; flex-direction: column; gap: 12px;
          padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom)); }
  @media (min-width: 520px) {
    .wrap { min-height: 0; height: min(880px, calc(100dvh - 40px)); border-radius: 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25), 0 0 0 10px #1b1d20; overflow-y: auto; }
  }

  h1 { font-size: 30px; font-weight: 800; margin: 4px 0 0; text-align: center; letter-spacing: -0.01em; }

  .feed { width: 100%; aspect-ratio: 3 / 4; background: #000; border-radius: 20px; overflow: hidden;
          display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
  .frame { position: relative; max-width: 100%; max-height: 100%; }
  .frame video, .frame img { display: block; max-width: 100%; max-height: 100%; }
  .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hint { position: absolute; color: #aab2bd; font-size: 14px; text-align: center; padding: 20px; }

  .status { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: stretch;
            background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px;
            transition: border-color .2s; }
  .status.good { border-color: var(--good); }
  .status.bad { border-color: var(--bad); }
  .status-left { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; }
  .status .label { font-size: 16px; font-weight: 800; letter-spacing: .14em; color: var(--text); }
  .status .value { background: #0b0d0c; border-radius: 10px; padding: 10px 10px; color: #6b7280;
                   box-shadow: inset 0 0 0 2px #1d2220, inset 0 4px 14px rgba(0,0,0,.6); }
  .status .value svg { display: block; width: 118px; height: auto; }
  .status .value .on { fill: currentColor; filter: drop-shadow(0 0 3px currentColor); }
  .status .value .off { fill: currentColor; opacity: .08; }
  .status.good .value { color: #22e36b; }
  .status.bad .value { color: #ff3b30; }

  .serial { display: flex; flex-direction: column; text-align: left; border-radius: 10px; overflow: hidden;
            border: 1px solid #1d2220; background: #0b0d0c; min-width: 0; }
  .serial-head { display: flex; justify-content: space-between; align-items: center;
                 padding: 5px 8px; background: #151917; color: #9aa59f; font-size: 11px;
                 font-family: ui-monospace, Consolas, monospace; }
  .serial-head button { background: none; border: 1px solid #2c332f; color: #9aa59f;
                        border-radius: 6px; padding: 1px 7px; font-size: 10px; cursor: pointer; }
  .serial pre { margin: 0; height: 118px; overflow-y: auto; padding: 6px 8px;
                font: 11px/1.45 ui-monospace, Consolas, "Courier New", monospace; color: #c9d1cc;
                white-space: pre-wrap; word-break: break-word; }
  .serial .t { color: #5f6b65; }
  .serial .good { color: #22e36b; }
  .serial .bad { color: #ff4d42; }
  .serial .info { color: #e0b341; }
  .meta { text-align: center; font-size: 12px; color: var(--muted); min-height: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>InZpector!</h1>

  <div class="feed">
    <div class="frame">
      <video id="video" playsinline muted hidden></video>
      <img id="espimg" alt="" hidden>
      <canvas id="overlay"></canvas>
    </div>
    <div class="hint" id="hint">Starting camera…</div>
  </div>

  <div class="status" id="status">
    <div class="status-left">
      <div class="label">STATUS</div>
      <div class="value" id="value"></div>
    </div>
    <div class="serial">
      <div class="serial-head"><span>Serial Monitor</span><button id="clr">Clear</button></div>
      <pre id="serial"></pre>
    </div>
  </div>
  <div class="meta" id="meta"></div>
</div>

<script>
const CONF = 0.4;        // confidence threshold
const SEND_WIDTH = 640;  // width of frames sent to the server
const $ = (id) => document.getElementById(id);
const video = $("video"), espimg = $("espimg"), overlay = $("overlay"), ctx = overlay.getContext("2d");
let mode = "cam", running = false, stream = null, espTimer = null, lastId = 0, firstCall = true;
const isGood = (n) => n.toLowerCase().includes("good");

/* ---------- Seven-segment display ---------- */
// Segments: a=top, b=top-right, c=bottom-right, d=bottom, e=bottom-left, f=top-left, g=middle
const SEG_SHAPES = {
  a: "10,8 15,3 45,3 50,8 45,13 15,13",
  g: "10,50 15,45 45,45 50,50 45,55 15,55",
  d: "10,92 15,87 45,87 50,92 45,97 15,97",
  f: "8,10 13,15 13,43 8,48 3,43 3,15",
  b: "52,10 57,15 57,43 52,48 47,43 47,15",
  e: "8,52 13,57 13,85 8,90 3,85 3,57",
  c: "52,52 57,57 57,85 52,90 47,85 47,57",
};
const GLYPHS = {
  G: "acdef", O: "abcdef", S: "acdfg", t: "defg", U: "bcdef", d: "bcdeg", b: "cdefg", A: "abcefg", "-": "g", " ": "",
};
const DIGITS = 4;
function sevenSeg(text, digits = DIGITS) {
  const chars = text.padStart(digits, " ").slice(-digits).split("");
  const w = 70;
  let svg = `<svg viewBox="-4 0 ${digits * w} 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="skewX(-6) translate(8 0)">`;
  chars.forEach((ch, i) => {
    const lit = GLYPHS[ch] ?? "";
    svg += `<g transform="translate(${i * w} 0)">`;
    for (const [seg, pts] of Object.entries(SEG_SHAPES)) {
      svg += `<polygon points="${pts}" class="${lit.includes(seg) ? "on" : "off"}"/>`;
    }
    svg += "</g>";
  });
  return svg + "</g></svg>";
}
const DISPLAY_TEXT = { GOOD: "GOOd", BAD: "bAd" };   // what each status shows on the display

function setStatus(text, cls = "") {
  $("value").innerHTML = sevenSeg(DISPLAY_TEXT[text] || "----");
  $("value").setAttribute("aria-label", text);
  $("status").className = "status " + cls;
}
function meta(t) { $("meta").textContent = t || ""; }

/* ---------- Serial monitor ---------- */
const MAX_LINES = 200;
let lastLogged = "";
function log(text, cls = "") {
  const el = $("serial");
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 20;
  const line = document.createElement("div");
  const ts = new Date().toLocaleTimeString([], { hour12: false });
  line.innerHTML = `<span class="t">${ts}</span> <span class="${cls}"></span>`;
  line.lastChild.textContent = text;
  el.appendChild(line);
  while (el.childElementCount > MAX_LINES) el.firstChild.remove();
  if (atBottom) el.scrollTop = el.scrollHeight;
}
function logOnce(text, cls) { if (text !== lastLogged) { log(text, cls); lastLogged = text; } }
function hint(t) { $("hint").textContent = t || ""; $("hint").hidden = !t; }

function render(d) {
  overlay.width = d.width; overlay.height = d.height;
  ctx.clearRect(0, 0, d.width, d.height);
  const lw = Math.max(2, d.width / 300);
  let bad = 0, good = 0;
  for (const b of d.boxes) {
    const ok = isGood(b.class); ok ? good++ : bad++;
    ctx.strokeStyle = ok ? "#16a34a" : "#dc2626"; ctx.lineWidth = lw;
    ctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
  }
  if (bad) setStatus("BAD", "bad");
  else if (good) setStatus("GOOD", "good");
  else setStatus("No joint detected");
  meta(bad || good ? `${good} good · ${bad} bad` : "");
  const word = bad ? "BAD " : good ? "GOOD" : "----";
  log(`${word} G:${good} B:${bad} ${Math.round(d.inference_ms)}ms`, bad ? "bad" : good ? "good" : "");
  lastLogged = "";
}

/* ---------- Webcam ---------- */
async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: "environment" }, audio: false });
  } catch (e) { hint("Camera blocked. Allow camera access and reload the page."); log("ERROR: camera blocked", "bad"); return; }
  video.srcObject = stream; await video.play();
  video.hidden = false; hint(""); running = true;
  log(`Camera started (${video.videoWidth}x${video.videoHeight})`, "info");
  loopCam();
}

function stopCam() {
  running = false;
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null; video.hidden = true;
}

async function loopCam() {
  const grab = document.createElement("canvas");
  while (running && mode === "cam") {
    if (!video.videoWidth) { await new Promise((r) => setTimeout(r, 100)); continue; }
    // Send a smaller frame: the model works at 640 px anyway, so this cuts upload time
    const scale = Math.min(1, SEND_WIDTH / video.videoWidth);
    grab.width = Math.round(video.videoWidth * scale); grab.height = Math.round(video.videoHeight * scale);
    grab.getContext("2d").drawImage(video, 0, 0, grab.width, grab.height);
    const blob = await new Promise((r) => grab.toBlob(r, "image/jpeg", 0.8));
    if (firstCall) { setStatus("…"); meta("Waking up server, first check can take up to a minute."); logOnce("Waking up server...", "info"); }
    try {
      const res = await fetch(`./predict?conf=${CONF}`, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const d = await res.json(); firstCall = false;
      if (running && mode === "cam") render(d);
    } catch (e) { meta(e.message); logOnce("ERROR: " + e.message, "bad"); await new Promise((r) => setTimeout(r, 1500)); }
  }
}

/* ---------- ESP32 ---------- */
async function pollEsp() {
  try {
    const d = await (await fetch("./latest", { cache: "no-store" })).json();
    if (!d.id) { hint("Waiting for the ESP32 to send a frame…"); setStatus("—"); return; }
    if (d.age_s > 10) meta(`ESP32 last seen ${Math.round(d.age_s)} s ago`);
    if (d.id !== lastId) {
      lastId = d.id;
      espimg.onload = () => { espimg.hidden = false; hint(""); render(d.result); };
      espimg.src = `./latest.jpg?id=${d.id}`;
    }
  } catch (e) { meta(e.message); }
}

function setMode(m) {
  mode = m; setStatus("—"); meta(""); ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (m === "esp") {
    stopCam(); lastId = 0; espimg.hidden = true; hint("Connecting to ESP32…");
    pollEsp(); espTimer = setInterval(pollEsp, 500);
  } else {
    clearInterval(espTimer); espimg.hidden = true; hint("Starting camera…"); startCam();
  }
}

$("clr").onclick = () => { $("serial").innerHTML = ""; lastLogged = ""; };
log("InZpector! ready", "info");
/* ---------- Auto-switch to the ESP32 camera when it is sending frames ---------- */
async function watchEsp() {
  try {
    const d = await (await fetch("./latest", { cache: "no-store" })).json();
    const fresh = d.id && d.age_s < 6;
    if (fresh && mode === "cam") { log("ESP32 connected: showing ESP32 camera", "info"); setMode("esp"); }
    else if (mode === "esp" && (!d.id || d.age_s > 12)) { log("ESP32 stopped: back to webcam", "info"); setMode("cam"); }
  } catch (e) { /* server asleep or offline; webcam loop reports errors */ }
}
setInterval(watchEsp, 2000);

setStatus("—");
startCam();
</script>
</body>
</html>
